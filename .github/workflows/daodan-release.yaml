name: Daodan release

on:
  push:
    branches: [feature/stack-detection, "daodan-*"] # a push builds and tests; only a tag or a manual start releases
    tags: ["v*-daodan.*"]
  workflow_dispatch: # builds the branch it is started on and releases it under the tag of its version

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failing command before a pipe fails the step

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      file: ${{ steps.pack.outputs.file }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run prebuild
      # 4441 problems older than this workflow (file names, formatting of the ported rules): lint never ran on this
      # branch. It is shown and does not stop the release until that debt is paid.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      - run: npx vitest run --coverage.enabled=false

      # verify-package.mjs takes no argument: it runs `npm pack` itself, checks the archive from an empty folder and
      # prints `package <path>` and `sha256 <hex>`. The archive uploaded is the one it checked.
      - name: Pack and verify
        id: pack
        run: |
          node benchmarks/verify-package.mjs | tee verify.txt
          tgz=$(awk '$1 == "package" { print $2 }' verify.txt)
          cp "$tgz" .
          echo "file=$(basename "$tgz")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.file }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TGZ: ${{ needs.package.outputs.file }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.file }}

      - name: Create the release
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not the package version $version"
            exit 1
          fi
          sha256=$(sha256sum "$TGZ" | cut -d' ' -f1)
          echo "sha256 $sha256  $TGZ"
          gh release create "$version" "$TGZ" --target "$GITHUB_SHA" --title "$version" \
            --notes "Built by GitHub Actions from $GITHUB_SHA. sha256 of $TGZ: $sha256"
